<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pi Chat</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/vendor/katex.css"><script defer src="/vendor/marked.js"></script><script defer src="/vendor/purify.js"></script><script defer src="/vendor/katex.js"></script><script defer src="/vendor/auto-render.js"></script><script defer src="/app.js"></script></head><body>
<div class="app" id="app"><button class="scrim" aria-label="关闭侧栏" data-toggle></button><aside class="sidebar"><div class="brandrow"><span class="brand">pi</span><button class="icon" aria-label="收起侧栏" data-toggle>☰</button></div><button class="navbutton" id="newChat">＋ 新对话</button><input id="search" aria-label="搜索会话" placeholder="搜索会话" style="background:none;border:0;padding:12px;width:100%;outline-offset:-2px"><div class="history"><div class="label">本应用会话</div><div id="history"></div></div><div class="workspace"><div class="avatar">π</div><div><strong>Pi Chat</strong><small>本地 · RPC</small></div></div></aside><main class="main"><header class="topbar"><div class="top-left"><button class="icon show-sidebar" aria-label="展开侧栏" data-toggle>☰</button><span class="wordmark">Pi</span><span class="subtitle" id="title">新对话</span></div><div class="top-right" id="status" role="status">连接中</div></header><div class="scroll" id="scroll"><div class="conversation" id="messages"></div><div class="conversation" id="notices" role="status"></div></div><div class="bottom"><div class="composer-wrap"><div id="error" class="error" role="alert" hidden></div><div class="command-list" id="commands" hidden></div><form class="composer" id="composer"><textarea id="prompt" rows="2" aria-label="消息" placeholder="发送消息给 Pi…"></textarea><div class="composer-tools"><div class="select-wrap"><select id="model" aria-label="模型" disabled></select></div><span class="divider"></span><div class="select-wrap"><select id="effort" aria-label="思考强度" disabled></select></div><button type="submit" class="send" id="send" aria-label="发送" disabled>↑</button></div></form><div class="footnote">Pi 可读取、修改文件并执行命令。网页不是沙箱。</div></div></div></main></div><dialog id="dialog"><form class="dialog-form" id="dialogForm"><h3 id="dialogTitle"></h3><p id="dialogMessage"></p><div id="dialogInput"></div><footer><button type="button" id="cancelDialog">取消</button><button class="primary" type="submit">确认</button></footer></form></dialog></body></html>
